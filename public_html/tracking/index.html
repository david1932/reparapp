<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Reparación - ReparApp</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- WhatsApp & Social Media Preview (OG Tags) -->
    <meta property="og:title" content="📱 Consulta tu Reparación">
    <meta property="og:description" content="Pincha aquí para ver el estado en tiempo real.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/1055/1055666.png">
    <meta name="theme-color" content="#22d3ee">

    <style>
        :root {
            --bg-deep: #020617;
            --bg-card: rgba(15, 23, 42, 0.6);
            --border-card: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --primary: #0095ff;
            --logo-bg: #0084ff;
        }

        * {
            box-sizing: border-box;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-deep);
            background-image:
                radial-gradient(circle at 50% 0%, rgba(0, 149, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(129, 140, 248, 0.04) 0%, transparent 50%);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-card);
            border-radius: 32px;
            padding: 40px 32px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .header {
            margin-bottom: 32px;
        }

        .logo-wrapper {
            width: 80px;
            height: 80px;
            background: var(--logo-bg);
            border-radius: 22px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 132, 255, 0.3);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            fill: none;
            stroke: white;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #ffffff;
        }

        .subtitle {
            margin: 0;
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .search-box {
            background: rgba(10, 15, 30, 0.5);
            border: 1px solid var(--border-card);
            border-radius: 20px;
            padding: 6px;
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            align-items: center;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 12px 16px;
            font-size: 15px;
            outline: none;
            width: 100%;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        #btn-search {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 149, 255, 0.2);
            font-family: inherit;
        }

        #btn-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 149, 255, 0.3);
        }

        #btn-search:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        #error-msg {
            color: #f87171;
            background: rgba(220, 38, 38, 0.1);
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 13px;
            display: none;
            margin-bottom: 24px;
            text-align: left;
            line-height: 1.4;
        }

        .status-card {
            display: none;
            margin-top: 24px;
            text-align: left;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge-container {
            margin-bottom: 24px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge.recibido { background: rgba(245, 158, 11, 0.1); color: #f59e0b; }
        .badge.diagnostico { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .badge.reparando { background: rgba(129, 140, 248, 0.1); color: #818cf8; }
        .badge.listo { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge.entregado { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .badge.cancelado { background: rgba(239, 68, 68, 0.1); color: #ef4444; }

        .detail-group {
            margin-bottom: 20px;
        }

        .detail-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .solution-box {
            background: rgba(0, 149, 255, 0.05);
            border: 1px solid rgba(0, 149, 255, 0.1);
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .solution-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .solution-text {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .checklist-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .checklist-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .photo-gallery {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: thin;
        }

        .photo-gallery img {
            height: 80px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid var(--border-card);
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: var(--text-dim);
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="logo-wrapper">
                <svg class="logo-icon" viewBox="0 0 24 24">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                </svg>
            </div>
            <h1>Estado de Reparación</h1>
            <p class="subtitle">Consulta el progreso de tu dispositivo en tiempo real</p>
        </div>

        <div class="search-box">
            <input type="text" id="repair-id" placeholder="ID de reparación..." maxlength="50">
            <button id="btn-search">Buscar</button>
        </div>

        <div id="error-msg"></div>

        <div id="result" class="status-card">
            <div class="badge-container">
                <span id="status-badge" class="badge">Recibido 📦</span>
            </div>

            <div class="detail-group">
                <div class="detail-label">Dispositivo</div>
                <div class="detail-value">
                    <span id="dev-icon">📱</span>
                    <span id="dev-name-value">---</span>
                </div>
            </div>

            <div class="detail-group">
                <div class="detail-label">Problema Reportado</div>
                <div class="detail-value" id="problem-value" style="font-weight: 400; color: var(--text-dim);">
                    ---
                </div>
            </div>

            <div id="solution-container" class="solution-box" style="display: none;">
                <div class="solution-title">Informe Técnico / Solución</div>
                <div id="solution-text" class="solution-text"></div>
            </div>

            <div id="checklist-container" style="display: none; margin-bottom: 20px;">
                <div class="detail-label" style="margin-bottom: 10px;">Puntos Verificados</div>
                <div id="checklist-items" class="checklist-grid"></div>
            </div>

            <div id="photos-container" style="display: none; margin-bottom: 20px;">
                <div class="detail-label" style="margin-bottom: 10px;">Fotografías</div>
                <div id="photos-gallery" class="photo-gallery"></div>
            </div>
        </div>

        <div class="footer">
            Powered by ReparApp &copy; 2026
        </div>
    </div>

    <script>
        // CONFIGURACIÓN CENTRAL
        const SUPABASE_URL = 'https://yihgvgsajrncsamkwjlq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpaGd2Z3NhanJuY3NhbWt3amxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwOTc0MzQsImV4cCI6MjA4NDY3MzQzNH0.BPeBsv2QRU_aWeO5jNWvcbh-66PpVNZ4OgVczEELMJA';

        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('t');
        let dynamicUrl = urlParams.get('u');
        let dynamicKey = urlParams.get('k');

        function decodeSafe(str) {
            if (!str) return null;
            try {
                if (str.includes('.') || str.startsWith('http')) return str;
                return atob(decodeURIComponent(str));
            } catch (e) { return str; }
        }

        let _supabase = null;

        function initSupabase() {
            let finalUrl = SUPABASE_URL;
            let finalKey = SUPABASE_KEY;
            let idFromToken = null;

            if (token) {
                try {
                    let base64 = token.replace(/-/g, '+').replace(/_/g, '/');
                    while (base64.length % 4) base64 += '=';
                    const decoded = atob(base64);
                    const parts = decoded.split('|');
                    if (parts.length === 3) {
                        idFromToken = parts[0];
                        finalUrl = parts[1];
                        finalKey = parts[2];
                    }
                } catch (e) { console.error('Token Error:', e); }
            } else if (dynamicUrl && dynamicKey) {
                finalUrl = decodeSafe(dynamicUrl);
                finalKey = decodeSafe(dynamicKey);
            }

            if (!window.supabase || !window.supabase.createClient) return null;
            _supabase = window.supabase.createClient(finalUrl, finalKey);

            // --- STEALTH MODE ---
            if (window.history && window.history.replaceState) {
                const url = new URL(window.location.href);
                if (url.searchParams.has('t') || url.searchParams.has('u') || url.searchParams.has('k')) {
                    const cleanUrl = window.location.pathname + (url.searchParams.get('id') ? '?id=' + url.searchParams.get('id') : '');
                    window.history.replaceState({}, document.title, cleanUrl);
                }
            }
            return idFromToken;
        }

        const initialId = initSupabase();

        // UI
        const inputId = document.getElementById('repair-id');
        const btnSearch = document.getElementById('btn-search');
        const card = document.getElementById('result');
        const errorMsg = document.getElementById('error-msg');

        window.addEventListener('load', () => {
            const id = urlParams.get('id') || initialId;
            if (id) {
                inputId.value = id;
                searchRepair(id);
            }
        });

        btnSearch.addEventListener('click', () => searchRepair(inputId.value.trim()));
        inputId.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchRepair(inputId.value.trim()); });

        async function searchRepair(input) {
            if (!input) return;
            let finalId = input.trim();

            if (finalId.includes('?id=')) {
                try {
                    const u = new URL(finalId.startsWith('http') ? finalId : 'https://' + finalId);
                    finalId = u.searchParams.get('id') || finalId;
                } catch (e) { }
            }

            finalId = finalId.replace(/[^a-zA-Z0-9-]/g, '');
            if (finalId.length < 10) return;

            card.style.display = 'none';
            errorMsg.style.display = 'none';
            btnSearch.textContent = '⏳ ...';
            btnSearch.disabled = true;

            try {
                const { data, error } = await _supabase
                    .from('reparaciones')
                    .select('id, estado, marca, modelo, problema, fecha_creacion, precio_final, solucion, checklist, dispositivo')
                    .eq('id', finalId)
                    .maybeSingle();

                if (error) {
                    console.error('Supabase error:', error);
                    if (error.code === '22P02') {
                        throw new Error('El formato del ID no es válido.');
                    }
                    throw new Error('Error al consultar. Inténtalo de nuevo.');
                }

                if (!data) {
                    throw new Error('Reparación no encontrada. Si es reciente, puede que aún no se haya sincronizado.');
                }

                renderResult(data);
            } catch (e) {
                errorMsg.style.display = 'block';
                errorMsg.innerHTML = `⚠️ ${e.message}<br><small>Pulsa "Sincronizar" en la App si es nueva.</small>`;
            } finally {
                btnSearch.textContent = 'Buscar';
                btnSearch.disabled = false;
            }
        }

        function getDeviceIcon(type) {
            if (!type) return '📱';
            const t = type.toLowerCase();
            if (t === 'movil' || t === 'móvil') return '📱';
            if (t === 'tablet') return '📱';
            if (t === 'ordenador' || t === 'pc' || t === 'portátil' || t === 'portatil') return '💻';
            if (t === 'consola' || t === 'videoconsola') return '🎮';
            return '📱';
        }

        function renderResult(rep) {
            const devName = (rep.marca || '').toUpperCase();
            const devModel = (rep.modelo || '');
            const deviceLabel = [devName, devModel].filter(Boolean).join(' ') || 'Dispositivo';

            const deviceIcon = getDeviceIcon(rep.dispositivo);

            document.getElementById('dev-name-value').textContent = deviceLabel;
            document.getElementById('dev-icon').textContent = deviceIcon;
            document.getElementById('problem-value').textContent = rep.problema || 'No especificado';

            const badge = document.getElementById('status-badge');
            const st = (rep.estado || '').toLowerCase();

            badge.className = 'badge'; // reset

            let labelText = 'Recibido';
            let emoji = '📦';

            if (['pendiente', 'recibido'].includes(st)) {
                labelText = 'Recibido';
                emoji = '📦';
                badge.classList.add('recibido');
            } else if (st === 'en_diagnostico' || st.includes('diagnostico')) {
                labelText = 'En Diagnóstico';
                emoji = '🔍';
                badge.classList.add('diagnostico');
            } else if (['reparando', 'taller', 'proceso'].some(s => st.includes(s))) {
                labelText = 'Reparando';
                emoji = '🔧';
                badge.classList.add('reparando');
            } else if (['cancelado', 'cancelled'].includes(st)) {
                labelText = 'Cancelado';
                emoji = '❌';
                badge.classList.add('cancelado');
            } else if (st === 'entregado') {
                labelText = 'Entregado';
                emoji = '📦';
                badge.classList.add('entregado');
            } else {
                // listo, terminado
                labelText = 'Listo';
                emoji = '✅';
                badge.classList.add('listo');
            }

            badge.innerHTML = `${labelText} ${emoji}`;

            if (rep.solucion) {
                document.getElementById('solution-text').textContent = rep.solucion;
                document.getElementById('solution-container').style.display = 'block';
            } else {
                document.getElementById('solution-container').style.display = 'none';
            }

            // Checklist
            const checklistContainer = document.getElementById('checklist-container');
            const checklistItems = document.getElementById('checklist-items');
            if (rep.checklist) {
                try {
                    let chk = rep.checklist;
                    if (typeof chk === 'string') chk = JSON.parse(chk);
                    
                    const keys = Object.keys(chk);
                    if (keys.length > 0) {
                        checklistItems.innerHTML = keys.map(k => `
                            <div class="checklist-item">
                                <span>${chk[k] ? '✅' : '❌'}</span>
                                <span style="text-transform: capitalize;">${k.replace(/_/g, ' ')}</span>
                            </div>
                        `).join('');
                        checklistContainer.style.display = 'block';
                    } else {
                        checklistContainer.style.display = 'none';
                    }
                } catch (e) {
                    checklistContainer.style.display = 'none';
                }
            } else {
                checklistContainer.style.display = 'none';
            }

            // Photos
            const photosContainer = document.getElementById('photos-container');
            const photosGallery = document.getElementById('photos-gallery');
            if (rep.photos && rep.photos.length > 0) {
                photosGallery.innerHTML = rep.photos.map(p => `
                    <img src="${p}" onclick="window.open('${p}','_blank')">
                `).join('');
                photosContainer.style.display = 'block';
            } else {
                photosContainer.style.display = 'none';
            }

            card.style.display = 'block';
        }
    </script>
</body>

</html>
